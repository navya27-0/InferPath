services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferpath-api
    # Localhost binding by default (127.0.0.1) prevents unauthenticated network exposure in local-demo mode.
    # Set INFERPATH_HOST_BIND=0.0.0.0 only when INFERPATH_DEPLOYMENT_MODE=protected with a strong INFERPATH_API_KEY.
    ports:
      - "${INFERPATH_HOST_BIND:-127.0.0.1}:8000:8000"
    environment:
      - ADAPTER_MODE=${ADAPTER_MODE:-simulated}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - INFERPATH_ENVIRONMENT=${INFERPATH_ENVIRONMENT:-production}
      - INFERPATH_DEPLOYMENT_MODE=${INFERPATH_DEPLOYMENT_MODE:-local-demo}
      - INFERPATH_VERSION=${INFERPATH_VERSION:-0.3.0}
      - INFERPATH_API_KEY=${INFERPATH_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: ["uvicorn", "inferpath.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferpath-dashboard
    ports:
      - "${INFERPATH_HOST_BIND:-127.0.0.1}:8501:8501"
    environment:
      - INFERPATH_API_URL=http://api:8000
      - INFERPATH_API_KEY=${INFERPATH_API_KEY:-}
      - INFERPATH_VERSION=${INFERPATH_VERSION:-0.3.0}
      - ADAPTER_MODE=${ADAPTER_MODE:-simulated}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - INFERPATH_ENVIRONMENT=${INFERPATH_ENVIRONMENT:-production}
    command: ["streamlit", "run", "app/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
