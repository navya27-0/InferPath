name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Test Suite & Docker Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Ruff formatting
        run: |
          ruff format --check .

      - name: Check Ruff lint rules
        run: |
          ruff check .

      - name: Run hermetic offline test suite
        run: |
          # Deliberately ensure no API key is provided so network tests are blocked
          unset OPENROUTER_API_KEY
          pytest -v -m "not live"

      - name: Verify README results synchronization
        run: |
          python scripts/update_readme_results.py --check

      - name: Validate Docker Compose configurations
        run: |
          docker compose config
          docker compose -f docker-compose.local-demo.yml config

      - name: Build Docker image
        run: |
          docker build -t inferpath:test .

      - name: Run Docker container security smoke test
        run: |
          # 1. Verify that container defaults to loopback initialization cleanly
          docker run --rm inferpath:test python -c "from inferpath.api.main import create_app; app = create_app(); print('Default container loopback initialization succeeded')"

          # 2. Verify that public binding without API key halts startup (fail-closed security)
          echo "Verifying fail-closed protection when attempting public bind without API key..."
          if docker run --rm -e INFERPATH_HOST_BIND=0.0.0.0 -e INFERPATH_DEPLOYMENT_MODE=local-demo inferpath:test uvicorn inferpath.api.main:app --host 0.0.0.0 --port 8000; then
            echo "Security violation: Container should have failed closed on public bind without API key!"
            exit 1
          else
            echo "Expected fail-closed behavior confirmed: container halted startup."
          fi

          # 3. Start authenticated container on 0.0.0.0 and verify liveness probe succeeds
          docker run --rm -d --name inferpath-smoke -p 127.0.0.1:8000:8000 \
            -e ENVIRONMENT=staging \
            -e INFERPATH_DEPLOYMENT_MODE=staging \
            -e INFERPATH_HOST_BIND=0.0.0.0 \
            -e INFERPATH_API_KEY=test_smoke_api_key_2026 \
            inferpath:test \
            uvicorn inferpath.api.main:app --host 0.0.0.0 --port 8000
          
          sleep 4
          docker logs inferpath-smoke
          curl -sf http://127.0.0.1:8000/health/live
          # Verify diagnostic endpoint requires the configured key
          test $(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/dependencies) -eq 401
          test $(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: test_smoke_api_key_2026" http://127.0.0.1:8000/health/dependencies) -eq 200
          docker stop inferpath-smoke

          # 4. Start local-demo Compose stack and verify both services start and become healthy
          echo "Verifying that local-demo Docker Compose stack starts and reaches healthy status..."
          docker compose -f docker-compose.local-demo.yml up -d
          
          for i in $(seq 1 15); do
            API_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' inferpath-api-demo 2>/dev/null || echo '"unknown"')
            DASH_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' inferpath-dashboard-demo 2>/dev/null || echo '"unknown"')
            echo "Attempt $i: api=$API_HEALTH, dashboard=$DASH_HEALTH"
            if [ "$API_HEALTH" = '"healthy"' ] && [ "$DASH_HEALTH" = '"healthy"' ]; then
              echo "Both local-demo services are healthy!"
              break
            fi
            sleep 2
          done

          # Verify endpoints on both services
          curl -sf http://127.0.0.1:8000/health/live
          curl -sf http://127.0.0.1:8501/_stcore/health

          docker compose -f docker-compose.local-demo.yml down -v
