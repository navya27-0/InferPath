name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint & Hermetic Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Ruff formatting
        run: |
          ruff format --check .

      - name: Check Ruff lint rules
        run: |
          ruff check .

      - name: Run hermetic offline test suite
        run: |
          # Deliberately ensure no API key is provided so network tests are blocked
          unset OPENROUTER_API_KEY
          pytest -v -m "not live"

      - name: Verify README results synchronization
        run: |
          python scripts/update_readme_results.py --check
