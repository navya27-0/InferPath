metadata:
  effective_date: "2026-10-01"
  verification_status: "unverified_illustrative"
  limitations: "Coefficients are heuristic order-of-magnitude estimates for modeling framework validation only. Values are NOT empirically measured by this system and MUST NOT be cited as verified experimental observations or peer-reviewed facts. Environmental savings are strictly ESTIMATED and never labeled MEASURED."
  system_boundary_energy: "Scope 2 Datacenter operational compute (server dynamic + idle power per token multiplied by datacenter PUE). Excludes network transit, client device, and Scope 3 manufacturing."
  system_boundary_water: "Operational cooling water consumption (WUE) plus direct power generation water footprint. Excludes embodied manufacturing water."
  guidance: "Water is never a headline claim; reported as secondary metric only."

datacenter_pue:
  unit: "ratio"
  low: 1.10
  central: 1.20
  high: 1.35
  source_note: "Unverified heuristic assumption for modern hyperscaler datacenter efficiency; uncalibrated against live facility telemetry."
  verification_status: "unverified_illustrative"

