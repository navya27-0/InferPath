[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferpath"
version = "0.2.0"
description = "A research prototype for rigorous evaluation of a resource-aware AI inference router"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "streamlit>=1.40.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "hypothesis>=6.100.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferpath"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: opt-in live integration tests that require external network access and API credentials",
]
